spring.application.name=lab5

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/podcasts}
spring.datasource.username=${DB_USERNAME:podcast_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.max-failed-attempts=5
app.security.lock-duration=15m

app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
